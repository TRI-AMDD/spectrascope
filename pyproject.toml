[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrascope"
version = "1.0.0"
description = "Interpretable Machine learning toolkit for spectral data: feature generation, model training, and visualization."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    { name = "Toyota Research Institute" },
]
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
lcen = ["Code-SPA @ git+https://github.com/PedroSeber/SmartProcessAnalytics.git@v1.5.1"]
dev = ["pytest", "pre-commit", "black"]

[project.urls]
Homepage = "https://github.com/TRI-AMDD/spectrascope"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["spectrascope*"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
]
